[package]
name = "besu"
version = "0.0.1"
edition = "2021"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["tokio", "sqlite"]  # TODO: Disable as default
tokio = ["sqlx/runtime-tokio"]
sqlite = ["sqlx/sqlite"]

uuid = ["dep:uuid"]

[dependencies]
besu-macros = { version = "0.0.1" }
futures = { version = "0.3.29", default-features = false }
sqlx = { version = "0.7.2", default-features = false }

uuid = { version = "1.6.1", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.34.0", features = ["full"] }
sqlx = { version = "0.7.2", features = ["macros"] }
example-sqlite = { path = "./examples/sqlite" }

[workspace]
members = ["./crates/*", "./examples/*"]

[patch.crates-io]
besu = { path = "." }
besu-macros = { path = "./crates/macros" }
