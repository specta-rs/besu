[workspace]
resolver = "3"
members = [
    "./besu-core",
    "./besu",
    "./besu-macros",
    "./besu-any",
    "./besu-schema",
    "./besu-sqlite",
    "./besu-postgres",
    "./besu-mysql",
    "./besu-bridge",
    "./cli",
    "./besu-studio",
    "./examples/*",
]

[workspace.package]
version = "0.1.0"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/besu"
rust-version = "1.85"

[workspace.dependencies]
besu = { path = "./besu", version = "0.1.0", default-features = false }
besu-core = { path = "./besu-core", version = "0.1.0" }
besu-macros = { path = "./besu-macros", version = "0.1.0" }
besu-any = { path = "./besu-any", version = "0.1.0" }
besu-schema = { path = "./besu-schema", version = "0.1.0" }
besu-sqlite = { path = "./besu-sqlite", version = "0.1.0", default-features = false }
besu-postgres = { path = "./besu-postgres", version = "0.1.0", default-features = false }
besu-mysql = { path = "./besu-mysql", version = "0.1.0", default-features = false }
besu-bridge = { path = "./besu-bridge", version = "0.1.0", default-features = false }
besu-studio = { path = "./besu-studio", version = "0.1.0" }

uuid = "1"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false }
# 0.32 is the release that shares `libsqlite3-sys` 0.30 with sqlx 0.8, so the two drivers
# can be compiled into one binary. A newer rusqlite links a different `sqlite3`, and Cargo
# refuses two packages with the same `links` key in one graph.
rusqlite = { version = "0.32", default-features = false }
# The native PostgreSQL driver. `tokio-postgres` supplies the protocol and the types;
# `deadpool-postgres` supplies the pool. Neither is on the path when the `native` feature is
# off, so the default build is unchanged.
tokio-postgres = { version = "0.7", default-features = true }
deadpool-postgres = { version = "0.14", default-features = false }
bytes = "1"
futures-core = "0.3"
futures-channel = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# `wasm-bindgen` is not like the rest: the CLI that processes the module
# (`wasm-bindgen-test-runner`) refuses a module built by a different version, so the crate
# and the runner have to agree exactly. The CI job installs the CLI version this lockfile
# resolves, and a local `cargo test --target wasm32-unknown-unknown` needs
# `cargo install wasm-bindgen-cli` at the same version. The other wasm crates follow it.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = -1 }
missing_docs = { level = "warn", priority = -2 }

[workspace.lints.clippy]
# The `cargo` group is off because it reports missing crates.io metadata as a duplicate
# diagnostic for a workspace member every time any member is checked. The metadata itself is
# present on every crate.
all = { level = "warn", priority = -1 }
unwrap_used = { level = "warn", priority = -3 }
panic = { level = "warn", priority = -4 }
todo = { level = "warn", priority = -5 }

# Problems in downstream dependencies
multiple_crate_versions = { level = "allow", priority = 1 }

[workspace.metadata.release]
push = false
tag = false
enable-all-features = true
