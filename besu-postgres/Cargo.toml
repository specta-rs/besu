[package]
name = "besu-postgres"
description = "PostgreSQL dialect and driver for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database"]
documentation = "https://docs.rs/besu-postgres/latest/besu-postgres"
keywords = ["database", "postgresql", "query-builder", "typesafe"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The `tokio-postgres`-backed driver is the default. It uses `tokio_postgres::NoTls` and a
# `deadpool-postgres` pool; TLS is a separate API decision, not a hidden dependency.
default = ["native", "runtime-tokio"]
native = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:bytes"]
# The sqlx driver is an optional compatibility path. It is the one to choose when you want a
# pool with TLS, or an existing `sqlx::PgPool`; when it is enabled, `Database` names it.
sqlx = ["dep:sqlx"]
# This only affects the optional sqlx driver. `sqlx?` keeps it from turning sqlx on, so the
# default build stays native-only. It is a default feature so that `--features sqlx` works
# without also naming a runtime; with `default-features = false`, enable both `sqlx` and
# `runtime-tokio` (sqlx panics at runtime without one).
runtime-tokio = ["sqlx?/runtime-tokio"]

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
besu = { workspace = true, features = ["derive", "migrate"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "driver"
harness = false
# The benchmark measures the sqlx encoding path, so it only exists when sqlx does.
required-features = ["sqlx"]

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }
sqlx = { workspace = true, optional = true, features = ["postgres", "chrono", "uuid", "json", "bigdecimal"] }
tokio-postgres = { workspace = true, optional = true, features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = { workspace = true, optional = true, features = ["rt_tokio_1"] }
bytes = { workspace = true, optional = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
