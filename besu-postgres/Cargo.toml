[package]
name = "besu-postgres"
description = "PostgreSQL dialect and driver for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database"]
documentation = "https://docs.rs/besu-postgres/latest/besu-postgres"
keywords = ["database", "postgresql", "query-builder", "typesafe"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sqlx", "runtime-tokio"]
sqlx = ["dep:sqlx"]
runtime-tokio = ["sqlx/runtime-tokio"]
# The `tokio-postgres`-backed driver. Additive: it does not replace the sqlx driver, which
# stays the default until the native one has proven itself. It uses `tokio_postgres::NoTls`
# and a `deadpool-postgres` pool; TLS is a separate API decision, not a hidden dependency.
native = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:bytes"]

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
besu = { workspace = true, features = ["derive", "migrate"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "driver"
harness = false

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }
sqlx = { workspace = true, optional = true, features = ["postgres", "chrono", "uuid", "json", "bigdecimal"] }
tokio-postgres = { workspace = true, optional = true, features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = { workspace = true, optional = true, features = ["rt_tokio_1"] }
bytes = { workspace = true, optional = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
