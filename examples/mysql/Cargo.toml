[package]
name = "example-mysql"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
besu = { workspace = true, features = ["derive", "migrate"] }
# The examples use the default native driver on purpose: it is what a new dependency gets.
besu-mysql = { workspace = true, features = ["native"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
