[package]
name = "besu"
description = "A typesafe, async, and database-agnostic query builder for Rust."
version = "0.0.1"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/specta-rs/besu"
documentation = "https://docs.rs/besu/latest/besu"
keywords = ["async", "database", "query-builder", "typesafe"]
categories = ["web-programming", "asynchronous"]

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
derive = [] # TODO: "dep:besu-macros"]

[lints]
workspace = true

[dependencies]
# besu-macros = { workspace = true, optional = true }

# TODO: Remove this
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
