[package]
name = "besu"
version = "0.0.1"
edition = "2021"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

derive = ["dep:besu-macros"]

[lints]
workspace = true

[dependencies]
besu-macros = { workspace = true, optional = true }
