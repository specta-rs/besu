[package]
name = "besu"
description = "A typesafe, async, and database-agnostic SQL query builder for Rust."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/besu/latest/besu"
keywords = ["async", "database", "query-builder", "typesafe", "sql"]
categories = ["database", "asynchronous"]

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["derive", "migrate"]
derive = ["dep:besu-macros"]
migrate = ["dep:besu-schema"]

[lints]
workspace = true

[dependencies]
besu-core = { workspace = true, features = ["uuid", "chrono", "json"] }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
besu-macros = { workspace = true, optional = true }
besu-schema = { workspace = true, optional = true }
