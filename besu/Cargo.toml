[package]
name = "besu"
version = "0.0.1"
edition = "2021"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

macros = ["dep:besu-macros"]
uuid = ["dep:uuid"]

[lints]
workspace = true

[dependencies]
besu-macros = { workspace = true, optional = true}
uuid = { version = "1", optional = true, default-features = false }
