[package]
name = "besu-any"
description = "A runtime-selected Besu database, for when the backend comes from configuration."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/besu-any/latest/besu-any"
keywords = ["database", "sqlite", "postgresql", "mysql", "multi-database"]
categories = ["database"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
besu = { workspace = true, features = ["derive", "migrate"] }
# `AnyDatabase` returns `sqlx::Error` from its public API, so this crate deliberately stays on
# the sqlx driver. The drivers' default is native; `sqlx` is opt-in here, and `runtime-tokio`
# is what gives sqlx its tokio runtime. Enabling `sqlx` alone keeps `Database` on the sqlx
# driver even in a build where something else also enabled `native`.
besu-sqlite = { workspace = true, features = ["sqlx", "runtime-tokio"] }
besu-postgres = { workspace = true, features = ["sqlx", "runtime-tokio"] }
besu-mysql = { workspace = true, features = ["sqlx", "runtime-tokio"] }
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql", "runtime-tokio"] }
