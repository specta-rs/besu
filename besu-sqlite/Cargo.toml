[package]
name = "besu-sqlite"
description = "SQLite dialect and driver for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database"]
documentation = "https://docs.rs/besu-sqlite/latest/besu-sqlite"
keywords = ["database", "sqlite", "query-builder", "typesafe"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sqlx", "runtime-tokio"]
sqlx = ["dep:sqlx"]
runtime-tokio = ["sqlx/runtime-tokio"]

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
criterion = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }

[[bench]]
name = "driver"
harness = false

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }
sqlx = { workspace = true, optional = true, features = ["sqlite", "chrono", "uuid", "json"] }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
