[package]
name = "besu-sqlite"
description = "SQLite dialect and driver for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database"]
documentation = "https://docs.rs/besu-sqlite/latest/besu-sqlite"
keywords = ["database", "sqlite", "query-builder", "typesafe"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The `rusqlite`-backed driver is the default: no sqlx, no pool and no async runtime in its
# dependency path.
default = ["native", "runtime-tokio"]
native = ["dep:rusqlite", "dep:futures-channel"]
# The sqlx driver is an optional compatibility path. It is the one to choose when you want a
# pool, TLS or an existing `sqlx::SqlitePool`; when it is enabled, `Database` names it.
sqlx = ["dep:sqlx"]
# This only affects the optional sqlx driver. `sqlx?` keeps it from turning sqlx on, so the
# default build stays native-only. It is a default feature so that `--features sqlx` works
# without also naming a runtime; with `default-features = false`, enable both `sqlx` and
# `runtime-tokio` (sqlx panics at runtime without one).
runtime-tokio = ["sqlx?/runtime-tokio"]

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
criterion = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }

[[bench]]
name = "driver"
harness = false
# The benchmark measures the sqlx encoding path, so it only exists when sqlx does.
required-features = ["sqlx"]

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }
sqlx = { workspace = true, optional = true, features = ["sqlite", "chrono", "uuid", "json"] }
# `bundled` compiles SQLite from source, so a native build does not need a system library
# and does not change meaning with the machine it is built on.
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
futures-channel = { workspace = true, optional = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
