[package]
name = "besu-cli"
description = "Command line tooling for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database", "command-line-utilities"]
keywords = ["database", "cli", "migrations", "schema"]

[lints]
workspace = true

[[bin]]
name = "besu"
path = "src/main.rs"

[dependencies]
besu = { workspace = true, features = ["derive", "migrate"] }
besu-any = { workspace = true }
besu-core = { workspace = true }
besu-schema = { workspace = true }
# The CLI shares `AnyDatabase`, whose API is typed in `sqlx::Error`, so every driver stays on
# the sqlx path here. The drivers' default is native; `sqlx` is opt-in, and `runtime-tokio`
# gives sqlx its runtime. Naming `sqlx` explicitly also keeps `Database` on the sqlx driver
# if a workspace-wide build happens to enable `native` at the same time.
besu-postgres = { workspace = true, features = ["sqlx", "runtime-tokio"] }
besu-mysql = { workspace = true, features = ["sqlx", "runtime-tokio"] }
besu-sqlite = { workspace = true, features = ["sqlx", "runtime-tokio"] }
besu-studio = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
