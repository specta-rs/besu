[package]
name = "besu-cli"
description = "Command line tooling for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "besu"
path = "src/main.rs"

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu-postgres = { workspace = true, features = ["sqlx"] }
besu-mysql = { workspace = true, features = ["sqlx"] }
besu-sqlite = { workspace = true, features = ["sqlx"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
