[package]
name = "besu-macros"
description = "Macros for Besu"
version = "0.0.1"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/specta-rs/besu"
documentation = "https://docs.rs/besu/latest/besu"
keywords = ["async", "database", "query-builder", "typesafe"]
categories = ["web-programming", "asynchronous"]

[lib]
proc-macro = true

[features]
default = []

[lints]
workspace = true

[dependencies]
itertools = "0.13.0"
proc-macro2 = "1"
quote = "1"
syn = "2" # TODO: Restrict features
