[package]
name = "besu-sqlite"
description = "SQLite driver and dialect for Besu"
version = "0.0.1"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/besu"
documentation = "https://docs.rs/besu-sqlite/latest/besu-sqlite"
keywords = ["async", "database", "query-builder", "typesafe", "sqlite"]
categories = ["web-programming", "asynchronous"]

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
sqlx = ["dep:sqlx"]
tokio = ["sqlx?/runtime-tokio"]

[lints]
workspace = true

[dependencies]
besu = { workspace = true }
sqlx = { version = "0.8", default-features = false, optional = true, features = ["sqlite"] }
