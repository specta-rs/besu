[package]
name = "besu-sqlite"
version = "0.0.1"
edition = "2021"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
sqlx = ["dep:sqlx", "dep:futures"]
tokio = ["sqlx?/runtime-tokio"]

[lints]
workspace = true

[dependencies]
besu = { workspace = true }

futures = { version = "0.3", default-features = false, optional = true }
sqlx = { version = "0.8", default-features = false, optional = true, features = ["sqlite"] }
