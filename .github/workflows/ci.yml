name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-features
      - name: Run tests
        run: cargo test --workspace --all-features --exclude besu-postgres --exclude besu-mysql

  # The builder and the bridge client compile and run in a browser. The checks prove the
  # `wasm32` build stays clean; the last step runs the bridge's browser tests in headless
  # Chrome, which is what the native test cannot prove: that the module executes in a browser.
  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check besu-core
        run: cargo check --target wasm32-unknown-unknown -p besu-core --all-features --all-targets
      - name: Check besu without default features
        run: cargo check --target wasm32-unknown-unknown -p besu --no-default-features
      - name: Check besu with the derive
        run: cargo check --target wasm32-unknown-unknown -p besu --no-default-features --features derive --all-targets
      - name: Check besu with every feature
        run: cargo check --target wasm32-unknown-unknown -p besu --all-features --all-targets
      # A browser needs a real dialect to spell `?`, `$1` and `` ` `` correctly, and the
      # driver feature is what carries sqlx, tokio and mio. Turning it off leaves the
      # dialect and the DDL, which are pure `alloc`.
      - name: Check the SQLite dialect without its driver
        run: cargo check --target wasm32-unknown-unknown -p besu-sqlite --no-default-features
      - name: Check the PostgreSQL dialect without its driver
        run: cargo check --target wasm32-unknown-unknown -p besu-postgres --no-default-features
      - name: Check the MySQL dialect without its driver
        run: cargo check --target wasm32-unknown-unknown -p besu-mysql --no-default-features
      - name: Check the bridge client
        run: cargo check --target wasm32-unknown-unknown -p besu-bridge --all-targets
      # The runner and the `wasm-bindgen` crate must be the same version or the runner
      # refuses the module. The lockfile is the single source of that version.
      - name: Install wasm-bindgen-cli
        run: |
          version="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' \
            | head -n 1)"
          echo "Installing wasm-bindgen-cli $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Run the bridge browser tests
        run: cargo test --target wasm32-unknown-unknown -p besu-bridge --test browser
        env:
          # The ubuntu-latest image ships Chrome and a matching ChromeDriver. The runner
          # finds Chrome itself and uses this for the WebDriver process.
          CHROMEDRIVER: chromedriver

  database:
    name: database / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: besu
          POSTGRES_USER: besu
          POSTGRES_DB: besu
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: besu
          MYSQL_DATABASE: besu
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbesu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test ${{ matrix.database }}
        run: cargo test -p besu-${{ matrix.database }} --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all --check

  studio:
    name: studio frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: besu-studio/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: besu-studio/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # The bundle is committed so Cargo builds on a machine without Node. A
      # stale one would ship an old UI from the binary, which is the kind of
      # drift nobody notices until a release.
      - name: The committed bundle matches the source
        run: git diff --exit-code -- dist

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
