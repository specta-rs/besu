name: release

# crates.io *trusted publishing*: crates.io mints a short-lived token from this
# workflow's OIDC identity, so no long-lived `CARGO_REGISTRY_TOKEN` is stored in
# this repository or in Actions secrets. See `CONTRIBUTING.md` → "Releasing" for the
# one-time crates.io configuration.
#
# These four values must match the trusted publisher configured on crates.io for
# *every* published crate, or the token exchange is refused. A crate that has never
# been published cannot carry the setting, so its first version goes up with a
# one-off API token; see `CONTRIBUTING.md` → "The first release of a crate".
#   owner        specta-rs
#   repository   besu
#   workflow     release.yml
#   environment  release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    # The workspace's tests cover all three drivers, and the suites for the two
    # server-backed ones need a live database. Mirrors `ci.yml`'s `database` job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: besu
          POSTGRES_USER: besu
          POSTGRES_DB: besu
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: besu
          MYSQL_DATABASE: besu
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbesu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The release tag names the `besu` crate version. Every workspace crate is
      # bumped in lockstep, so a single tag releases all of them.
      - name: The tag must match the `besu` crate version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "besu") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version v$version"
            exit 1
          fi

      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # Must match the `environment` of the trusted publisher configured on
    # crates.io. Require reviewers on that environment to gate publishing.
    environment: release
    permissions:
      id-token: write # exchange the GitHub OIDC token for a crates.io token
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      # `--workspace` publishes every crate in dependency order, skipping the
      # examples (`publish = false`). `--locked` requires `Cargo.lock` to be
      # committed and up to date, so a release can never drift from the versions
      # CI tested.
      - name: cargo publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
