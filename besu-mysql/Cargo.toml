[package]
name = "besu-mysql"
description = "MySQL dialect and driver for Besu."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
categories = ["database"]
documentation = "https://docs.rs/besu-mysql/latest/besu-mysql"
keywords = ["database", "mysql", "query-builder", "typesafe"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sqlx", "runtime-tokio"]
sqlx = ["dep:sqlx", "dep:num-traits"]
runtime-tokio = ["sqlx/runtime-tokio"]

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
besu = { workspace = true, features = ["derive", "migrate"] }

[dependencies]
besu-core = { workspace = true }
besu-schema = { workspace = true }
besu = { workspace = true, features = ["derive", "migrate"] }
sqlx = { workspace = true, optional = true, features = ["mysql", "chrono", "uuid", "json", "bigdecimal"] }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
num-traits = { version = "0.2", optional = true }
